version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sofyanos
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: sofyanos

  app:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  postgres_data:
