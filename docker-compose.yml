services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sofyan
      POSTGRES_USER: sofyan
      POSTGRES_PASSWORD: sofyan
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
