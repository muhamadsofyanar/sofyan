<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · {{app_name}}</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f6f8;margin:0;color:#111827}
.box{max-width:360px;margin:12vh auto;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px}
h1{font-size:24px;margin:0 0 6px}.muted{color:#6b7280;font-size:14px}
input,button{width:100%;padding:11px;border-radius:10px;font:inherit;box-sizing:border-box}
input{border:1px solid #e5e7eb;margin-top:10px}button{border:0;background:#111827;color:white;margin-top:14px;cursor:pointer}
.err{color:#991b1b;font-size:13px;margin-top:10px}
</style>
</head>
<body><div class="box">
<h1>{{app_name}}</h1><div class="muted">Command center pribadi, STIFIn, dan IZINHUKUM.</div>
{% if error %}<div class="err">{{error}}</div>{% endif %}
<form method="post" action="/login">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button>Masuk</button>
</form>
</div></body></html>
